<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="server.login_title">Sign in</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--line:#e3e6ea;--fg:#1f2430;--dim:#6b7280;--accent:#2563eb;--err:#b42318}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13.5px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 28px;
  width:100%;max-width:400px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
h1{margin:0 0 4px;font-size:17px;font-weight:600}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
input{width:100%;background:#f0f2f5;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  font:inherit;outline:none;color:var(--fg)}
input:focus{border-color:var(--accent);background:#fff}
button{width:100%;margin-top:14px;background:var(--accent);border:1px solid var(--accent);color:#fff;
  border-radius:8px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.06)}
.err{margin-top:12px;color:var(--err);font-size:12.5px;display:none}
.err.on{display:block}
.tip{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
.foot{margin-top:10px;font-size:12px;color:var(--dim);text-align:center}
.foot a{color:var(--accent);text-decoration:none}
code{background:#f0f2f5;border:1px solid var(--line);border-radius:4px;padding:0 4px;
  font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <h1 data-i18n="ui.app_title">Session Explorer</h1>
  <div class="sub" data-i18n="server.login_sub">Enter the access token to continue.</div>
  <label for="token" data-i18n="server.login_label">Access token</label>
  <input id="token" name="token" type="password" autocomplete="current-password" autofocus data-i18n-ph="server.login_placeholder" placeholder="Paste the token">
  <button type="submit" data-i18n="server.login_submit">Enter</button>
  <div class="err" id="err">__ERROR__</div>
  <div class="tip" id="tip" data-i18n-html="server.login_note"></div>
  <div class="foot"><a href="?lang=zh">中文</a> · <a href="?lang=en">English</a></div>
</form>
<script>
(function(){
  var e = document.getElementById("err");
  if (e.textContent.trim()) e.classList.add("on");
  try{
    if (localStorage.getItem("se-theme") === "dark"){
      document.documentElement.style.setProperty("--bg","#111417");
      document.documentElement.style.setProperty("--panel","#171b1f");
      document.documentElement.style.setProperty("--line","#2a3138");
      document.documentElement.style.setProperty("--fg","#dfe6ee");
      document.documentElement.style.setProperty("--dim","#8fa0b0");
      document.documentElement.style.setProperty("--accent","#4aa8ff");
      document.querySelector("input").style.background = "#1d2228";
    }
  }catch(err){}
  // 记住语言选择，登录后首页沿用
  try{
    var lang = new URLSearchParams(location.search).get("lang");
    if (lang) localStorage.setItem("se-lang", lang);
  }catch(err){}
})();
</script>
</body>
</html>
